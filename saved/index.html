<div class="page-full">
    <div class="back-row">
        <button type="button" class="back-link" @click="goBack()">← Back</button>
    </div>
    <h1 class="page-title">Pinned messages</h1>
    <p class="page-lead">
        Messages you've pinned with a label. Pin from any chat (📌 next to a message) or from a search result.
    </p>
    <p v-if="!savedPins.length" class="results-empty">
        Nothing pinned yet. Tap 📌 on any message to save it here.
    </p>
    <ul v-else class="pin-list pin-list-page">
        <li v-for="p in savedPins" :key="p.url" class="saved-pin-row">
            <div class="saved-pin-body">
                <div class="saved-pin-name">{{ p.value.name }}</div>
                <div class="saved-pin-snippet">{{ p.value.snippet }}</div>
                <div v-if="p.value.querySnapshot && p.value.querySnapshot !== '(from chat)'" class="saved-pin-meta">
                    Found via search: <em>{{ p.value.querySnapshot }}</em>
                </div>
            </div>
            <button
                type="button"
                class="saved-drop"
                title="Remove pinned message"
                :disabled="isDeletingSaved.has(p.url)"
                @click="deleteSavedPin(p)"
            >
                {{ isDeletingSaved.has(p.url) ? "…" : "Remove" }}
            </button>
        </li>
    </ul>
</div>
