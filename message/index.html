<li class="message-row" :class="{ 'message-row-menu-open': menuOpen }" :id="messageDomId">
    <div class="message-bubble">
        <div class="message-menu message-bubble-menu" ref="menuRoot" @click.stop>
            <button
                type="button"
                class="kebab-btn message-bubble-kebab"
                :aria-expanded="menuOpen ? 'true' : 'false'"
                aria-haspopup="menu"
                title="More actions"
                aria-label="More actions"
                @click.stop="toggleMenu"
            >
                ⋯
            </button>
            <div v-if="menuOpen" class="message-menu-pop" role="menu">
                <button
                    v-if="!isPinned"
                    type="button"
                    class="message-menu-item"
                    role="menuitem"
                    @click="handlePin"
                >
                    Pin
                </button>
                <button
                    v-else
                    type="button"
                    class="message-menu-item"
                    role="menuitem"
                    @click="handleUnpin"
                >
                    Unpin
                </button>
                <button
                    v-if="object.actor === $graffitiSession.value?.actor"
                    type="button"
                    class="message-menu-item message-menu-danger"
                    role="menuitem"
                    :disabled="isDeleting.has(object.url)"
                    @click="handleDelete"
                >
                    {{ isDeleting.has(object.url) ? "Deleting…" : "Delete" }}
                </button>
            </div>
        </div>
        <div class="message-meta">
            <strong>
                <UserName :actor="object.value.sender || object.actor" />
            </strong>
            <span
                v-if="object.value.content && object.value.content.trim()"
                class="message-text"
            >
                : <LinkedText :text="object.value.content" />
            </span>
        </div>
        <div v-if="object.value.attachmentUrl" class="message-image-block">
            <div
                class="message-image"
                :class="{ 'message-image-expanded': imageExpanded }"
                role="button"
                tabindex="0"
                :aria-expanded="imageExpanded ? 'true' : 'false'"
                aria-label="Image attachment — tap to expand or collapse"
                @click="toggleImageExpand"
                @keydown.enter.prevent="toggleImageExpand"
                @keydown.space.prevent="toggleImageExpand"
            >
                <graffiti-get-media
                    :url="object.value.attachmentUrl"
                    :accept="{ types: ['image/*'] }"
                ></graffiti-get-media>
            </div>
            <p v-if="!imageExpanded" class="message-image-hint">Tap image to enlarge</p>
        </div>
        <div class="message-footer-meta">
            <button
                v-if="isPinned"
                type="button"
                class="pinned-chip pinned-chip-action"
                title="Open pinned messages"
                @click="goPinnedPage"
            >
                Pinned
            </button>
            <span v-if="sentAtLabel" class="message-time">{{ sentAtLabel }}</span>
        </div>
    </div>
</li>
