<div class="page-full">
    <div class="back-row">
        <button type="button" class="back-link" @click="goBack()">← Back</button>
        <router-link class="results-edit" :to="{ name: 'search', query: route.query }">Edit search</router-link>
    </div>
    <h1 class="page-title">Search results</h1>
    <p v-if="searchScopedChat" class="results-scope">
        In:
        <span class="results-scope-peers">
            <template v-for="(a, i) in rosterActors(searchScopedChat)" :key="'rs-' + i + '-' + String(a).slice(-24)">
                <span class="peer-chip"><graffiti-actor-to-handle :actor="a" /></span>
                <span
                    v-if="i < rosterActors(searchScopedChat).length - 1"
                    class="peer-sep"
                    aria-hidden="true"
                    >·</span
                >
            </template>
        </span>
    </p>
    <p v-else class="results-scope">Across all your conversations</p>

    <p
        v-if="!searchResults.length"
        class="results-empty"
    >
        No messages match. Try different words or filters.
    </p>
    <ul v-else class="result-groups">
        <li v-for="g in searchResultsByChat" :key="g.threadId || 'unknown'" class="result-group">
            <header class="result-group-head">
                <router-link
                    v-if="g.threadId"
                    class="result-open"
                    :to="{ name: 'chat', params: { chatId: g.threadId } }"
                >
                    Open chat
                </router-link>
                <span v-if="g.chat" class="result-peerline">
                    <template
                        v-for="(a, i) in rosterActors(g.chat)"
                        :key="(g.threadId || 'u') + '-rp-' + i"
                    >
                        <span class="peer-chip">
                            <graffiti-actor-to-handle :actor="a" />
                        </span>
                        <span
                            v-if="i < rosterActors(g.chat).length - 1"
                            class="peer-sep"
                            aria-hidden="true"
                            >·</span
                        >
                    </template>
                </span>
                <span v-else class="result-peerline result-peerline-unknown">Unknown chat</span>
                <span class="result-group-count">{{ g.items.length }} match{{ g.items.length === 1 ? '' : 'es' }}</span>
            </header>
            <ul class="result-match-list">
                <li v-for="obj in g.items" :key="obj.url" class="result-match">
                    <div class="result-match-meta">
                        <strong>
                            <graffiti-actor-to-handle :actor="obj.value.sender || obj.actor" />
                        </strong>
                        <span v-if="obj.value.content && obj.value.content.trim()" class="result-match-text">
                            : {{ obj.value.content }}
                        </span>
                    </div>
                    <div v-if="obj.value.attachmentUrl" class="result-thumb">
                        <graffiti-get-media
                            :url="obj.value.attachmentUrl"
                            :accept="{ types: ['image/*'] }"
                        ></graffiti-get-media>
                    </div>
                    <div class="pin-row">
                        <button type="button" class="pin-btn" @click="pinResult(obj)">📌 Pin message</button>
                    </div>
                </li>
            </ul>
        </li>
    </ul>
</div>
