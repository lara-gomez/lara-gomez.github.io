<div class="app-shell layout" v-if="$graffitiSession.value">
    <header class="app-top-nav">
        <router-link :to="{ name: 'home' }" class="app-brand">Messages</router-link>
        <nav class="app-nav-links">
            <router-link :to="{ name: 'home' }" class="nav-tab" :class="{ 'nav-active': navChatsActive }"
                >Chats</router-link
            >
            <router-link :to="{ name: 'saved' }" class="nav-tab" :class="{ 'nav-active': navSavedActive }"
                >Pinned</router-link
            >
            <span class="identity-chip">
                <span class="identity-handle">
                    <UserName :actor="$graffitiSession.value.actor" />
                </span>
                <button
                    type="button"
                    class="identity-btn"
                    title="Log out"
                    aria-label="Log out"
                    @click="$graffiti.logout($graffitiSession.value)"
                >
                    ⎋
                </button>
            </span>
        </nav>
    </header>
    <div class="app-outlet">
        <router-view v-slot="{ Component }">
            <component v-if="Component" :is="Component" :messages="messages" />
        </router-view>
    </div>
    <transition name="toast">
        <div v-if="toast" :key="toast.key" class="toast" role="status">{{ toast.text }}</div>
    </transition>
</div>
<div class="layout-loading" v-else-if="$graffitiSession.value === undefined">
    <div class="layout-loading-inner">
        <p v-if="!sessionBootStalled">Loading Graffiti session…</p>
        <template v-else>
            <p>Connecting is taking unusually long.</p>
            <p class="layout-loading-sub">Try signing in again or reload.</p>
            <div class="layout-loading-actions">
                <button type="button" class="signedout-login" @click="$graffiti.login()">
                    Try sign-in
                </button>
                <button type="button" class="layout-loading-reload" @click="reloadApp">Reload page</button>
            </div>
        </template>
    </div>
</div>
<div class="layout-signedout" v-else>
    <button type="button" class="signedout-login" @click="$graffiti.login()">Log in to Messages</button>
</div>
