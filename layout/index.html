<div class="app-shell layout" v-if="$graffitiSession.value">
    <header class="app-top-nav">
        <router-link :to="{ name: 'home' }" class="app-brand">Messages</router-link>
        <nav class="app-nav-links">
            <router-link :to="{ name: 'home' }" class="nav-tab" :class="{ 'nav-active': navChatsActive }"
                >Chats</router-link
            >
            <router-link
                :to="
                    route.name === 'chat' && route.params.chatId
                        ? { name: 'search', query: { thread: String(route.params.chatId) } }
                        : { name: 'search' }
                "
                class="nav-tab"
                :class="{ 'nav-active': navSearchActive }"
                >Search</router-link
            >
            <router-link :to="{ name: 'saved' }" class="nav-tab" :class="{ 'nav-active': navSavedActive }"
                >Pinned</router-link
            >
            <span class="identity-chip" :title="identityTitle">
                <span class="identity-handle">
                    <graffiti-actor-to-handle :actor="$graffitiSession.value.actor" />
                </span>
                <button
                    type="button"
                    class="identity-btn"
                    title="Log out"
                    aria-label="Log out"
                    @click="$graffiti.logout($graffitiSession.value)"
                >
                    ⎋
                </button>
            </span>
        </nav>
    </header>
    <div class="app-outlet">
        <router-view v-slot="{ Component }">
            <component v-if="Component" :is="Component" :messages="messages" />
        </router-view>
    </div>
</div>
<div class="layout-loading" v-else-if="$graffitiSession.value === undefined">Loading…</div>
<div class="layout-signedout" v-else>
    <button type="button" class="signedout-login" @click="$graffiti.login()">Log in to Messages</button>
</div>
