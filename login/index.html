<div class="login-blank">
    <div class="login-card">
        <h1 class="login-title">Messages</h1>
        <p class="login-lead">Sign in with Graffiti to sync your conversations.</p>
        <button
            type="button"
            class="signedout-login"
            v-if="$graffitiSession.value === null"
            @click="$graffiti.login()"
        >
            Log in
        </button>
        <p v-else-if="$graffitiSession.value === undefined && !bootStalled" class="login-status">
            Loading Graffiti session…
        </p>
        <div v-else-if="$graffitiSession.value === undefined && bootStalled" class="login-stall">
            <p class="login-stall-copy">Connecting is taking unusually long.</p>
            <button type="button" class="signedout-login" @click="$graffiti.login()">Try sign-in</button>
            <button type="button" class="login-stall-reload" @click="reloadLoginPage">
                Reload page
            </button>
        </div>
        <p v-else class="login-status">Opening app…</p>
    </div>
</div>
