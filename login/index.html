<div class="login-blank">
    <div class="login-card">
        <h1 class="login-title">Messages</h1>
        <p class="login-lead">Sign in with Graffiti to sync your conversations.</p>
        <button
            type="button"
            class="signedout-login"
            v-if="$graffitiSession.value === null"
            @click="$graffiti.login()"
        >
            Log in
        </button>
        <p v-else class="login-status">Loading…</p>
    </div>
</div>
