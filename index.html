<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Messages</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <script src="index.js" type="module"></script>
    </head>
    <body>
        <div id="app">Loading…</div>
        <template id="template">
            <div class="auth-bar" v-if="!$graffitiSession.value">
                <span>Messages — sign in to sync chats</span>
                <button type="button" @click="$graffiti.login()">Log in</button>
            </div>
            <div class="auth-bar" v-else>
                <span>Signed in as</span>
                <span class="you">
                    <graffiti-actor-to-handle :actor="$graffitiSession.value.actor" />
                </span>
                <span style="opacity: 0.85">— others can paste your actor id when they start a chat with you.</span>
                <button type="button" @click="$graffiti.logout($graffitiSession.value)">
                    Log out
                </button>
            </div>

            <div class="layout" v-if="$graffitiSession.value">
                <aside class="sidebar">
                    <header class="sidebar-head">Messages</header>
                    <div class="search-row">
                        <span aria-hidden="true">🔍</span>
                        <input
                            type="search"
                            v-model="searchQuery"
                            placeholder="Search messages…"
                            @focus="sidebarView = 'search'"
                        />
                        <button
                            type="button"
                            class="btn-plus"
                            title="New conversation — choose people on the right"
                            @click="openCompose()"
                        >
                            +
                        </button>
                    </div>

                    <div class="nav-row">
                        <button type="button" @click="sidebarView = 'chats'">Chats</button>
                        <button type="button" @click="sidebarView = 'search'">Search</button>
                        <button type="button" @click="sidebarView = 'saved'">Saved</button>
                    </div>

                    <div class="pane" v-show="sidebarView === 'chats'">
                        <div v-if="!chats.length" class="pane-empty">
                            No conversations yet. Tap <strong>+</strong> beside the search field to pick people and
                            start a thread on the right.
                        </div>
                        <ul v-else class="msg-list">
                            <li v-for="chat in chats" :key="chat.url" class="chat-row">
                                <button
                                    type="button"
                                    class="chat-main"
                                    :class="{ active: channel === chat.value.channel }"
                                    @click="selectChat(chat.value.channel)"
                                >
                                    <span class="chat-peer-line">
                                        <template
                                            v-for="(a, i) in rosterActors(chat)"
                                            :key="chat.url + '-' + i + '-' + String(a).slice(-24)"
                                        >
                                            <span class="peer-chip">
                                                <graffiti-actor-to-handle :actor="a" />
                                            </span>
                                            <span
                                                v-if="i < rosterActors(chat).length - 1"
                                                class="peer-sep"
                                                aria-hidden="true"
                                            >·</span>
                                        </template>
                                    </span>
                                    <span class="chat-sub">Private thread</span>
                                </button>
                                <button
                                    v-if="chat.actor === $graffitiSession.value?.actor"
                                    type="button"
                                    class="chat-del"
                                    title="Remove this chat from the directory (you created it)"
                                    :disabled="isDeletingChat.has(chat.url)"
                                    @click.stop="deleteChat(chat)"
                                >
                                    {{ isDeletingChat.has(chat.url) ? "…" : "Delete" }}
                                </button>
                            </li>
                        </ul>
                    </div>

                    <div class="pane" v-show="sidebarView === 'search'">
                        <div class="search-panel">
                            <div v-if="!chats.length" class="search-scope warn">
                                <strong>No conversations yet.</strong>
                                Start a chat with <strong>+</strong> first — then search can look through your
                                messages.
                            </div>
                            <div v-else class="search-scope ok">
                                <p class="search-scope-title">Cross-chat search</p>
                                <p style="margin: 0 0 10px; font-size: 0.82rem; color: var(--muted)">
                                    By default this looks through <strong>every thread you’re in</strong> so you can
                                    find something when you’re not sure which chat it was in. Use the option below to
                                    only search the conversation open on the right.
                                </p>
                                <label class="narrow-opt">
                                    <input v-model="searchOnlyOpenChat" type="checkbox" :disabled="!channel" />
                                    <span>Only search the open chat</span>
                                </label>
                            </div>
                            <h3 style="margin-top: 4px">Search</h3>
                            <p class="adv-note" style="margin-top: 0">
                                Type words in the bar at the top, then <strong>{{ searchRunButtonLabel }}</strong>. Open
                                <strong>Advanced</strong> for media, sender, and dates (across the same scope).
                            </p>
                            <button type="button" class="run-search" :disabled="!chats.length" @click="runSearch()">
                                {{ searchRunButtonLabel }}
                            </button>
                            <button type="button" class="toggle-adv" @click="advancedOpen = !advancedOpen">
                                Advanced search {{ advancedOpen ? "▾" : "▸" }}
                            </button>
                            <div v-show="advancedOpen" class="adv-block">
                                <label for="media">Media type</label>
                                <select id="media" v-model="mediaFilter">
                                    <option value="any">Any</option>
                                    <option value="text">Text</option>
                                    <option value="images">Images</option>
                                    <option value="links">Links</option>
                                    <option value="files">Files</option>
                                    <option value="chat">Chat</option>
                                </select>
                                <label>From person</label>
                                <div class="person-chips">
                                    <button
                                        type="button"
                                        class="p-chip"
                                        :class="{ on: peopleFilter === 'any' }"
                                        @click="peopleFilter = 'any'"
                                    >
                                        Anyone
                                    </button>
                                    <button
                                        v-for="a in peopleFilterOptions"
                                        :key="a"
                                        type="button"
                                        class="p-chip"
                                        :class="{ on: peopleFilter === a }"
                                        @click="peopleFilter = a"
                                    >
                                        <graffiti-actor-to-handle :actor="a" />
                                    </button>
                                </div>
                                <p class="adv-note" style="margin-bottom: 8px">
                                    Everyone in your chats is listed, even if they have not sent a message yet.
                                </p>
                                <div class="date-row">
                                    <div>
                                        <label for="df">From date</label>
                                        <input id="df" v-model="dateFrom" type="date" />
                                    </div>
                                    <div>
                                        <label for="dt">To date</label>
                                        <input id="dt" v-model="dateTo" type="date" />
                                    </div>
                                </div>
                            </div>
                            <div class="recent">
                                <h4>Recent searches</h4>
                                <p v-if="!recentSearches.length" style="margin: 0; font-size: 0.85rem; color: var(--muted)">
                                    No recent searches yet.
                                </p>
                                <ul>
                                    <li v-for="(q, i) in recentSearches" :key="i">
                                        <button type="button" @click="applyRecent(q)">{{ q }}</button>
                                    </li>
                                </ul>
                            </div>
                            <div class="saved-searches">
                                <h4>Saved searches (Graffiti, private to you)</h4>
                                <ul class="saved-list">
                                    <li v-for="s in mySavedSearches" :key="s.url" class="saved-item-row">
                                        <button type="button" class="saved-apply" @click="applySaved(s)">
                                            <strong>{{ s.value.name }}</strong>
                                            — {{ s.value.query }}
                                        </button>
                                        <button
                                            type="button"
                                            class="saved-drop"
                                            title="Remove saved search"
                                            :disabled="isDeletingSaved.has(s.url)"
                                            @click="deleteSavedSearch(s)"
                                        >
                                            {{ isDeletingSaved.has(s.url) ? "…" : "Remove" }}
                                        </button>
                                    </li>
                                </ul>
                                <button
                                    type="button"
                                    class="run-search"
                                    style="margin-top: 10px; background: #475569"
                                    :disabled="!searchQuery.trim()"
                                    @click="saveCurrentSearch()"
                                >
                                    Save this search
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="pane" v-show="sidebarView === 'saved'">
                        <div class="search-panel">
                            <h3 style="margin-top: 0">Saved</h3>
                            <p class="adv-note" style="margin-top: 0">
                                Named searches and pinned message excerpts live in your personal Graffiti channel. They
                                are <strong>not</strong> filtered by whatever search you last ran — the list is
                                everything you have saved.
                            </p>
                            <h4>Saved searches</h4>
                            <p
                                v-if="!mySavedSearches.length"
                                style="margin: 0 0 10px; font-size: 0.85rem; color: var(--muted)"
                            >
                                None yet. Use <strong>Save this search</strong> on the Search tab.
                            </p>
                            <ul v-else class="saved-list">
                                <li v-for="s in mySavedSearches" :key="s.url" class="saved-item-row">
                                    <button type="button" class="saved-apply" @click="applySaved(s)">
                                        <strong>{{ s.value.name }}</strong>
                                        — {{ s.value.query }}
                                    </button>
                                    <button
                                        type="button"
                                        class="saved-drop"
                                        title="Remove saved search"
                                        :disabled="isDeletingSaved.has(s.url)"
                                        @click="deleteSavedSearch(s)"
                                    >
                                        {{ isDeletingSaved.has(s.url) ? "…" : "Remove" }}
                                    </button>
                                </li>
                            </ul>
                            <h4>Saved results</h4>
                            <p v-if="!savedPins.length" style="margin: 0; font-size: 0.85rem; color: var(--muted)">
                                Pin messages from the <strong>Search results</strong> view with “Save result”.
                            </p>
                            <ul v-else class="pin-list">
                                <li v-for="p in savedPins" :key="p.url" class="saved-pin-row">
                                    <div>
                                        <div style="font-size: 0.8rem; font-weight: 700">{{ p.value.name }}</div>
                                        <div style="font-size: 0.8rem; color: var(--muted)">
                                            Query: {{ p.value.querySnapshot }}
                                        </div>
                                        <div>{{ p.value.snippet }}</div>
                                    </div>
                                    <button
                                        type="button"
                                        class="saved-drop"
                                        title="Remove saved result"
                                        :disabled="isDeletingSaved.has(p.url)"
                                        @click="deleteSavedPin(p)"
                                    >
                                        {{ isDeletingSaved.has(p.url) ? "…" : "Remove" }}
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="pane" v-show="sidebarView === 'results'">
                        <div class="results-head">
                            <strong>Search results</strong>
                            <button type="button" @click="sidebarView = 'search'">Edit search</button>
                        </div>
                        <p
                            v-if="!searchResults.length"
                            style="padding: 12px 16px; margin: 0; color: var(--muted); font-size: 0.9rem"
                        >
                            No messages match. Try different words or filters.
                        </p>
                        <ul v-else class="result-list">
                            <li v-for="obj in searchResults" :key="obj.url">
                                <div v-if="messageThreadId(obj)" class="result-thread">
                                    <button
                                        type="button"
                                        class="result-open"
                                        @click="selectChat(messageThreadId(obj))"
                                    >
                                        Open chat
                                    </button>
                                    <span v-if="chatForChannel(messageThreadId(obj))" class="result-peerline">
                                        <template
                                            v-for="(a, i) in rosterActors(chatForChannel(messageThreadId(obj)))"
                                            :key="obj.url + '-rp-' + i"
                                        >
                                            <span class="peer-chip">
                                                <graffiti-actor-to-handle :actor="a" />
                                            </span>
                                            <span
                                                v-if="i < rosterActors(chatForChannel(messageThreadId(obj))).length - 1"
                                                class="peer-sep"
                                                aria-hidden="true"
                                            >·</span>
                                        </template>
                                    </span>
                                </div>
                                <div>
                                    <strong>
                                        <graffiti-actor-to-handle
                                            :actor="obj.value.sender || obj.actor"
                                        />
                                    </strong>
                                    : {{ obj.value.content }}
                                </div>
                                <div class="pin-row">
                                    <button type="button" @click="pinResult(obj)">Save result</button>
                                </div>
                            </li>
                        </ul>
                        <div class="search-panel" style="margin-top: 8px">
                            <h3>Saved results</h3>
                            <p class="adv-note" style="margin-top: 0; margin-bottom: 8px">
                                These are <strong>all</strong> pins you have ever saved — not only matches for this
                                search. Open the <strong>Saved</strong> tab to manage them or remove mistakes.
                            </p>
                            <p v-if="!savedPins.length" style="margin: 0; font-size: 0.85rem; color: var(--muted)">
                                Pin hits from search with “Save result”.
                            </p>
                            <ul v-else class="pin-list">
                                <li v-for="p in savedPins" :key="p.url" class="saved-pin-row">
                                    <div>
                                        <div style="font-size: 0.8rem; font-weight: 700">{{ p.value.name }}</div>
                                        <div style="font-size: 0.8rem; color: var(--muted)">
                                            Query: {{ p.value.querySnapshot }}
                                        </div>
                                        <div>{{ p.value.snippet }}</div>
                                    </div>
                                    <button
                                        type="button"
                                        class="saved-drop"
                                        title="Remove saved result"
                                        :disabled="isDeletingSaved.has(p.url)"
                                        @click="deleteSavedPin(p)"
                                    >
                                        {{ isDeletingSaved.has(p.url) ? "…" : "Remove" }}
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </aside>

                <main class="main" :class="{ 'has-thread': !!(channel || composeOpen) }">
                    <div v-if="composeOpen" class="compose-card">
                        <h2>New conversation</h2>
                        <p>
                            Add everyone who should see this thread: one <strong>Graffiti actor</strong> per line.
                        </p>
                        <textarea
                            v-model="composeRecipients"
                            placeholder="<your-user>.graffiti.actor"
                        ></textarea>
                        <div class="compose-actions">
                            <button type="button" class="ghost" @click="closeCompose()">Cancel</button>
                            <button
                                type="button"
                                class="primary"
                                :disabled="isCreatingChat"
                                @click="createConversation()"
                            >
                                {{ isCreatingChat ? "Starting…" : "Start conversation" }}
                            </button>
                        </div>
                    </div>
                    <div v-else-if="!channel" class="idle-main">
                        <p>
                            When you’re not in a chat, this space stays open. Use <strong>+</strong> in the bar on the
                            left to choose who to message.
                        </p>
                    </div>
                    <div v-else class="thread">
                        <h2 class="thread-title">
                            <template v-if="selectedRosterActors.length">
                                <template
                                    v-for="(a, i) in selectedRosterActors"
                                    :key="'hdr-' + i + '-' + String(a).slice(-24)"
                                >
                                    <span class="peer-chip">
                                        <graffiti-actor-to-handle :actor="a" />
                                    </span>
                                    <span
                                        v-if="i < selectedRosterActors.length - 1"
                                        class="peer-sep"
                                        aria-hidden="true"
                                    >·</span>
                                </template>
                            </template>
                            <template v-else>Conversation</template>
                        </h2>
                        <p class="thread-sub">Thread messages</p>
                        <p v-if="areMessageObjectsLoading" class="loading">Loading messages…</p>
                        <ul v-else>
                            <li v-for="object of sortedMessageObjects" :key="object.url">
                                <strong>
                                    <graffiti-actor-to-handle
                                        :actor="object.value.sender || object.actor"
                                    />
                                </strong>
                                : {{ object.value.content }}
                                <button
                                    v-if="object.actor === $graffitiSession.value?.actor"
                                    type="button"
                                    @click="deleteMessage(object)"
                                    :disabled="isDeleting.has(object.url)"
                                >
                                    {{ isDeleting.has(object.url) ? "Deleting…" : "Delete" }}
                                </button>
                            </li>
                        </ul>
                        <form class="composer" @submit.prevent="sendMessage()">
                            <input type="text" v-model="myMessage" placeholder="Write a message…" />
                            <input
                                type="submit"
                                :value="isSending ? 'Sending…' : 'Send'"
                                :disabled="!myMessage || isSending"
                            />
                        </form>
                    </div>
                </main>
            </div>
        </template>
    </body>
</html>
