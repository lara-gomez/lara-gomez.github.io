<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Messages</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
                    "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <script src="main.js" type="module"></script>
    </head>
    <body>
        <div id="app">Loading…</div>
        <!-- Shell: auth uses only Graffiti globals. Layout passes messaging state into route views via props. -->
        <template id="template">
            <div class="auth-bar" v-if="$graffitiSession.value === undefined">
                <span>Loading…</span>
            </div>
            <div class="auth-bar" v-else-if="$graffitiSession.value === null">
                <span>Messages — sign in to sync chats</span>
                <button type="button" @click="$graffiti.login()">Log in</button>
            </div>
            <div class="auth-bar" v-else>
                <span>Signed in as</span>
                <span class="you">
                    <graffiti-actor-to-handle :actor="$graffitiSession.value.actor" />
                </span>
                <span style="opacity: 0.85"
                    >— others can paste your actor id when they start a chat with you.</span
                >
                <button type="button" @click="$graffiti.logout($graffitiSession.value)">Log out</button>
            </div>
            <router-view></router-view>
        </template>
    </body>
</html>
